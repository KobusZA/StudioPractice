<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wall elevation</title>
  <link rel="icon" href="../logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./v2.css?v=20261109-mirror-corner" />
</head>
<body class="wall-screen">
  <!-- The wall elevation on a second monitor. This page holds no document and
       no logic of its own: the plan tab (ui.js) mounts the elevation into
       #screen-face and handles every control in it. The script below only
       says so when the plan tab is gone or has been reloaded. -->
  <main class="wall-screen-main">
    <p class="wall-screen-wait" id="screen-waiting">Waiting for a wall or a floor. Select one on the plan and open it here.</p>
    <div class="wall-screen-face" id="screen-face" hidden></div>
    <div class="wall-screen-note" id="screen-note" hidden>
      <p id="screen-note-text"></p>
      <button type="button" id="screen-close" hidden>Close window</button>
    </div>
  </main>
  <script>
    (function () {
      var note = document.getElementById("screen-note");
      var text = document.getElementById("screen-note-text");
      var close = document.getElementById("screen-close");
      var face = document.getElementById("screen-face");
      close.addEventListener("click", function () { window.close(); });
      var last = "";
      function link() {
        try {
          var plan = window.opener;
          if (!plan || plan.closed) return "closed";
          if (plan.__tspWallScreen !== window) return "reloaded";
          return "live";
        } catch (e) {
          return "closed";
        }
      }
      function tick() {
        var state = link();
        if (state === last) return;
        last = state;
        if (state === "live") {
          delete document.body.dataset.link;
          note.hidden = true;
          return;
        }
        // Whatever the old plan left here is dead: its listeners went with it.
        while (face.firstChild) face.removeChild(face.firstChild);
        face.hidden = true;
        document.body.dataset.link = state;
        note.hidden = false;
        close.hidden = state !== "closed";
        text.textContent = state === "closed"
          ? "The plan is closed."
          : "The plan was reloaded. Open the wall or the floor on the plan to continue.";
        document.title = "Wall elevation";
      }
      tick();
      window.setInterval(tick, 500);
    })();
  </script>
</body>
</html>
