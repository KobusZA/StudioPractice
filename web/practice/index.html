<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudioPractice — practice operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./practice.css" />
</head>
<body>

<!-- Signed out. The register is a firm's book of work; there is no anonymous
     view of it, so this is a gate rather than a banner. -->
<div class="gate" id="gate" hidden>
  <form class="form" id="gate-form">
    <h1>Practice operations</h1>
    <p id="gate-blurb">The project register, the timesheet and payment certificates.</p>
    <div class="fields">
      <div class="field">
        <label for="gate-email">Email</label>
        <input id="gate-email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="gate-password">Password</label>
        <input id="gate-password" type="password" autocomplete="current-password" required />
      </div>
      <div class="field" id="gate-org-field" hidden>
        <label for="gate-org">Firm name</label>
        <input id="gate-org" type="text" autocomplete="organization" />
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" type="submit" id="gate-submit">Sign in</button>
      <button class="btn" type="button" id="gate-toggle">Create a firm</button>
    </div>
    <p class="note-line" id="gate-error"></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <div class="topbar">
    <div class="brand"><div class="brand-mark">S</div><div class="brand-name">StudioPractice</div></div>
    <!-- Top-level destinations, not a job list. The register's rows live
         inside Register; a navigation element that is also the master list
         leaves the firm-wide view nowhere to be. -->
    <nav class="nav" id="nav" aria-label="Practice operations">
      <button type="button" data-view="practice">Practice</button>
      <button type="button" data-view="register">Register</button>
    </nav>
    <div class="spacer"></div>
    <button class="btn btn-sm" id="switch-job" hidden>Switch job <kbd>Ctrl K</kbd></button>
    <button class="btn btn-sm btn-primary" id="new-project">New job</button>
    <span class="who" id="who"></span>
    <button class="btn btn-sm" id="sign-out">Sign out</button>
  </div>

  <div class="workspace" id="workspace">
    <div class="main" id="main"></div>
  </div>
</div>

<!-- On demand, never resident. Switching job is a thing people do a few times
     a day, which buys a keystroke rather than a third of the window. -->
<div class="switcher" id="switcher" role="dialog" aria-modal="true" aria-label="Switch job" hidden>
  <div class="switcher-frame">
    <input id="switcher-query" type="text" autocomplete="off" spellcheck="false"
           placeholder="Job code, description or client" aria-controls="switcher-list" />
    <div id="switcher-list" role="listbox" aria-label="Jobs"></div>
  </div>
</div>

<div class="composer" id="composer" role="dialog" aria-modal="true" aria-labelledby="composer-title" hidden>
  <div class="composer-frame" id="composer-body"></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
